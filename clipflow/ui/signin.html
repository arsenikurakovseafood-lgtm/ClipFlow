<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · ClipFlow</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/signin.js" defer></script>
</head>
<body>
<header><div class="bar"><a class="brand" href="/">Clip<span>Flow</span></a></div></header>
<main class="signin">
  <p class="eyebrow">Owner Studio</p>
  <h1>Sign in</h1>
  <form id="signin">
    <label id="signin-email">Email<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
    <button type="submit">Sign in</button>
    <p id="login-status" role="status"></p>
  </form>
</main>
</body>
</html>
